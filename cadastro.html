<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Studium</title>
</head>
<body>

    <h2>Criar Conta</h2>

    <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Seu Nome" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Sua Senha" required>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form> 

    <div id="mensagem" style="margin-top: 15px;"></div>

    <p>Já tem uma conta? <a href="login.html">Fazer Login</a></p>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const divMensagem = document.getElementById('mensagem');

            try {
                // Envia os dados para a API PHP
                const resposta = await fetch('cadastroAPI.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        nome_usuario: nome, 
                        email_usuario: email, 
                        senha_usuario: senha 
                    })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    divMensagem.style.color = 'green';
                    divMensagem.innerText = dados.mensagem + ' Redirecionando para o login...';

                    // Limpa os campos do formulário
                    document.getElementById('formCadastro').reset();

                    // Aguarda 2 segundos e manda para a tela de login
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    divMensagem.style.color = 'red';
                    divMensagem.innerText = dados.erro;
                }
            } catch (erro) {
                divMensagem.style.color = 'red';
                divMensagem.innerText = 'Erro ao se conectar com o servidor.';
            }
        });
    </script>
</body>
</html>
