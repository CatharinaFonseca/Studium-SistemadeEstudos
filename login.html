<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Studium</title>
</head>
<body>

    <h2>Login - Studium</h2>

    <form id="formLogin">
        <label for="email_usuario">E-mail:</label>
        <input type="email" id="email_usuario" required>
        
        <br><br>

        <label for="senha_usuario">Senha:</label>
        <input type="password" id="senha_usuario" required>

        <br><br>

        <button type="submit">Entrar</button>
        <button type="button" onclick="window.location.href='recupSenha.php'">Esqueceu a senha?</button>
    </form>

    <div id="mensagem" style="margin-top: 15px;"></div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(event) {
            event.preventDefault(); // Impede o recarregamento da página

            const email_usuario = document.getElementById('email_usuario').value;
            const senha_usuario = document.getElementById('senha_usuario').value;
            const divMensagem = document.getElementById('mensagem');

            try {
                // Envia os dados para a API PHP
                const resposta = await fetch('loginAPI.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email_usuario: email_usuario, senha_usuario: senha_usuario })
                });

                const dados = await resposta.json();
                console.log("Objeto retornado pelo PHP:", dados);

                if (resposta.ok) {
                    const tokenGerado = dados.token || dados.jwt; 

                    if (tokenGerado) {
                        localStorage.setItem('token_jwt', tokenGerado);
                        console.log("Token salvo com sucesso:", tokenGerado);
                        window.location.href = 'home.html';
                    } else {
                        console.error("A API não retornou uma chave 'token' ou 'jwt':", dados);
                        alert("Erro: A resposta do servidor não continha um Token válido.");
                    }
                }
                else {
                    divMensagem.style.color = 'red';
                    divMensagem.innerText = dados.mensagem || "Erro ao fazer login.";
                }
            } catch (erro) {
                divMensagem.style.color = 'red';
                divMensagem.innerText = 'Erro ao se conectar com o servidor.';
            }
        });
    </script>
</body>
</html>
